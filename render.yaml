# Blueprint Render : https://render.com/docs/blueprint-spec
# Render → New → Blueprint → choisis ce dépôt. Les valeurs « sync: false » te seront demandées à la création.
services:
  - type: web
    name: albummania
    runtime: node
    plan: starter # un disque persistant demande une offre payante
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: albummania-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_FILE
        value: /var/data/albummania.db
      - key: TRUST_PROXY
        value: "true"
      - key: APP_URL # ex. https://albummania.onrender.com ou ton domaine
        sync: false
      - key: ADMIN_EMAILS # ton adresse e-mail : toi seul seras admin
        sync: false
      - key: SMTP_HOST # ex. smtp-relay.brevo.com
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM # ex. AlbumMania <no-reply@ton-domaine.fr>
        sync: false
      - key: COVERS # "auto" : pochettes de Deezer (jamais copiées) ; "off" pour tout couper
        value: auto
      - key: SHARE_COVERS # "deezer" : vraies pochettes dans les images à partager ; "off" : visuels générés
        value: deezer
      - key: LEGAL_EDITOR_NAME # mentions légales, voir DEPLOIEMENT.md
        sync: false
      - key: LEGAL_EDITOR_ADDRESS
        sync: false
      - key: LEGAL_EDITOR_EMAIL
        sync: false
      - key: LEGAL_PUBLICATION_DIRECTOR
        sync: false
      - key: LEGAL_HOST_NAME
        sync: false
      - key: LEGAL_HOST_ADDRESS
        sync: false
      - key: LEGAL_HOST_PHONE
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: TERMS_VERSION # date des CGU en vigueur, ex. 2026-10-06
        sync: false
      - key: CATALOG_IMPORT # "deezer" : le serveur importe tout seul ~20 000 albums depuis Deezer ; "off" pour s'en tenir aux 20 albums de base
        value: deezer
      - key: CATALOG_TARGET # nombre d'albums à importer
        value: "20000"
